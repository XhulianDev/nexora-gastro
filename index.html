<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu – Urban Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="status-hub-container"></div>

<div class="header">
    <div id="table-label" style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Tavolina --</div>
    <h1 style="font-family: 'Playfair Display', serif; font-size: 28px;">Urban Bar</h1>
</div>

<div class="categories" id="cat-bar" style="display:none"></div>
<div id="menu-list"></div>
<div style="height: 120px;"></div>

<div class="cart-bar" id="cart-bar">
    <div id="cart-preview"></div>
    
    <div class="cart-footer">
        <div>
            <div style="font-size: 12px; color: var(--muted);">Total</div>
            <div id="cart-total" style="font-weight: 700; font-size: 18px;">0.00 €</div>
        </div>
        <button class="cart-btn-main" onclick="openModal()">Porosit <span id="cart-count"></span></button>
    </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay') closeModal()">
    <div class="modal" id="modal">
        <div id="modal-body"></div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
