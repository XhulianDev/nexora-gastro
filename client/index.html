<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meny – Casa Mia Terrazza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=ng-5-1-3" />
</head>
<body>

  <aside id="status-hub-container" aria-live="polite"></aside>

  <header class="page-header">
    <div id="table-label" class="page-header__table-label">Tavolina --</div>
    <h1 class="page-header__title">Casa Mia Terrazza</h1>
  </header>


  <section class="client-intro" aria-label="Udhëzim i shkurtër">
    <p>Shfletoni menynë, shtoni artikuj në porosi ose thërrisni kamarierin nga tavolina juaj.</p>
  </section>

  <nav id="cat-bar" class="categories" aria-label="Kategoritë e menysë" hidden></nav>

  <main id="menu-list" class="menu-list"></main>

  <div class="page-spacer" aria-hidden="true"></div>

  <section id="cart-bar" class="cart-bar" aria-label="Përmbledhja e porosisë">
    <div id="cart-preview" class="cart-preview" role="list"></div>

    <footer class="cart-footer">
      <div class="cart-summary">
        <span class="cart-summary__label">Total</span>
        <output id="cart-total" class="cart-summary__value">0.00 €</output>
      </div>

      <button id="cart-open-btn" class="button button--primary cart-btn-main" type="button">
        Porosit <span id="cart-count" class="cart-count-badge"></span>
      </button>
    </footer>
  </section>

  <div id="overlay" class="overlay" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal__header">
        <h2 id="modal-title" class="modal__title">Përmbledhja e porosisë</h2>
      </header>
      <div id="modal-body" class="modal__body"></div>
    </section>
  </div>

  <template id="template-item">
    <article class="item-card">
      <div class="item-image"></div>
      <div class="item-info">
        <h3 class="item-name"></h3>
        <p class="item-desc"></p>
        <span class="item-price"></span>
      </div>
      <div class="qty-ctrl"></div>
    </article>
  </template>

  <script type="module" src="js/app.js?v=pilot-casa-mia-2"></script>
</body>
</html>
